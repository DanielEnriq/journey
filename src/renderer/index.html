<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://*.googleusercontent.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.livekit.cloud wss://*.livekit.cloud"
    />
    <title>Journey</title>
    <style>
      /* Light/dark follows the Theme setting via nativeTheme in main. */
      :root { color-scheme: light dark; --muted: color-mix(in srgb, currentColor 55%, transparent); --line: color-mix(in srgb, currentColor 15%, transparent); }
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem 2rem; max-width: 720px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
      h1 { font-size: 1.1rem; margin: 0; }
      h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 1.75rem 0 0.5rem; }
      #user { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
      #user img { width: 28px; height: 28px; border-radius: 50%; }
      ul { list-style: none; margin: 0 0 0.75rem; padding: 0; }
      li { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
      li > div { flex: 1; min-width: 0; }
      .path { color: var(--muted); font-size: 0.85em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .empty { color: var(--muted); }
      label { display: flex; align-items: center; gap: 0.75rem; }
      form { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
      #call { border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
      #call-head { display: flex; align-items: center; gap: 0.75rem; }
      #call-head strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #call li img { width: 24px; height: 24px; border-radius: 50%; }
      #call li:last-child { border-bottom: 0; }
      .speaking { box-shadow: 0 0 0 2px #2a7; }
      .status { color: var(--muted); font-size: 0.85em; }
      #repo { border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 1rem; margin-top: 0.75rem; }
      #repo-head { display: flex; align-items: center; gap: 0.75rem; }
      #repo-head strong { flex: 1; min-width: 0; }
      #repo h3 { font-size: 0.85em; margin: 0.75rem 0 0.25rem; }
      #repo li { padding: 0.25rem 0; font-size: 0.9em; }
      #repo li:last-child { border-bottom: 0; }
      .card { border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem 1rem; margin-top: 0.75rem; }
      .card-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
      #detected { max-height: 320px; overflow-y: auto; }
      #detected li { padding: 0.35rem 0; }
      #detected li:last-child { border-bottom: 0; }
      #repos li.selected > div:first-child { font-weight: 600; }
      #repos li > div { cursor: pointer; }
      #error { color: #d33; min-height: 1.5em; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>Journey</h1>
      <div id="user"></div>
    </header>

    <h2>Repositories</h2>
    <ul id="repos"></ul>
    <button id="add-repo">Add repository…</button>
    <button id="detect-repos">Find repositories</button>
    <section id="detected" class="card" hidden>
      <div class="card-head"><strong>Found on this Mac</strong><button id="detected-close" aria-label="Close">×</button></div>
      <ul id="detected-list"></ul>
    </section>
    <section id="repo" hidden>
      <div id="repo-head"><strong id="repo-name"></strong><span id="repo-branch" class="status"></span><button id="repo-refresh">Refresh</button></div>
      <h3>Changes</h3>
      <ul id="repo-changes"></ul>
      <h3>Branches</h3>
      <ul id="repo-branches"></ul>
      <h3>Worktrees</h3>
      <ul id="repo-worktrees"></ul>
    </section>

    <h2>Rooms</h2>
    <section id="call" hidden>
      <div id="call-head">
        <strong id="call-room"></strong>
        <span id="call-status" class="status"></span>
        <button id="call-audio" hidden>Enable audio</button>
        <button id="call-mute"></button>
        <button id="call-leave">Leave call</button>
      </div>
      <div id="call-error" class="status" role="status"></div>
      <ul id="call-participants"></ul>
    </section>
    <label>
      Workspace
      <select id="workspace"></select>
    </label>
    <ul id="rooms"></ul>
    <form id="new-room"><input name="name" placeholder="New room" required /><button>Create room</button></form>
    <form id="new-workspace"><input name="name" placeholder="New workspace" required /><button>Create workspace</button></form>

    <h2>Settings</h2>
    <label>
      Theme
      <select id="theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>

    <div id="error" role="alert"></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
